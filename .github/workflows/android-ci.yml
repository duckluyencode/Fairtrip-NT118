name: Android CI

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-ci.yml']

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      # AGP 9 needs JDK 17 or newer. The Android SDK comes with the runner; the Android Gradle
      # plugin downloads the platform it is missing.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # No local.properties here: the app builds without a Maps key and with the default
      # backend address, which is all the unit tests and lint need.
      - run: ./gradlew --no-daemon testDebugUnitTest
      - run: ./gradlew --no-daemon lintDebug
      - run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          retention-days: 7
